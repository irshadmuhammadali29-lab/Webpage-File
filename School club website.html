<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>School club website</title>

<style>
body{
background-image: linear-gradient(to right, orange, yellow);
}
h1{
text-align: center;
color: forestgreen;
}
.club-card{
text-align: center;
padding: 25px;
border-radius: 16px;
border: 2px solid olivedrab;
margin-bottom: 30px;
background: linear-gradient(to top, purple, orangered);
}
h3{
color: greenyellow;
}
p{
color: darkseagreen;
}
</style>
    </head>

    <body>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<h1>School club website</h1>

<div class="container">

    <div class="row">

        <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
        <h3>Maths Club</h3>
        <p>We learn to calculate, it's important to learn.</p>
        </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
         <div class="club-card">
        <h3>Science Club</h3>
        <p>We learn to make something new, and explore how science works.</p>
         </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
        <h3>English club</h3>
        <p>We learn new words in english, to improve our talking skills</p>
        </div>
        </div>
    </div>
</div>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </body>
</html>

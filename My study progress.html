<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf8">
<meta name="viewport" content="width=device-width, 
initial-scalr=1.0">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<title>My study progress</title>
</head>
<body>
<div class="jumbotron jumbotron-fluid">
    <div class="container">
    <h1>Study progress bar</h1>
    <p class="lead">Track your progress in this website</p>

    <button class="btn btn-primary">
        English
    </button>
    <button class="btn btn-success">
        Maths
    </button>
    <button class="btn btn-warning">
        Science
    </button>
    <button class="btn btn-danger">
        Coding
    </button>
    </div>
    </div>
    <h3>Badges of different subjects</h3>
<div class="container">
<p>English<span class="badge badge-primary">
    6 lessons
</span></p>
<p>Maths<span class="badge badge-success">
    6 lessons
</span></p>
<p>Science<span class="badge badge-warning">
6 lessons
</span></p>
<p>Coding<span class="badge badge-danger">
6 lessons
</span></p>
</div>
<h3>Progress bar of different subjects</h3>
<p>English</p>
<div class="progress mb-3">
    <div class="progress-bar bg-primary"
    style="width: 93.6%">93.6%</div>
    </div>
</div>
<p>Maths</p>
<div class="progress mb-3">
    <div class="progress-bar bg-success"
    style="width: 82.4%">82.4%</div>
</div>
<p>Science</p>
<div class="progress mb-3">
    <div class="progress-bar bg-warning"
    style="width: 100%">100%</div>
    </div>
</div>
<div class="progress mb-3">
    <div class="progress-bar bg-danger"
    style="width: 21.6%">21.6%</div>
    </div>
</div>
</body>
</html>

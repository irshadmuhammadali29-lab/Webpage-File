<!DOCTYPE html>
<html lang="en">
    <head>
<meta charset="UTF8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My fitness routine card</title>

<style>
    body {
        Background-color: lightyellow;
    }
.Routine-card{
    width: 200px;
    margin: 2px;
    border: 6px solid darkblue;
    border-radius: 12px;
    padding: 2px;
    background: linear-gradient(to right, burlywood, forestgreen);
}
h1 {
    text-align: center;
    color: mediumseagreen;
}
h2 {
    color: darkslategrey;
}
li {
    color: beige;
    list-style: none;
}
footer {
    color:blue;
    text-align: center;
    font-size: x-large;
    font-weight: bolder;
    font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif
}

</style>
    </head>
    <body>
<h1>My fitness card routine</h1>
<center>
<div class="Routine-card">
    <h2>Important routine</h2>
    <ul>
        <li>Healthy food</li>
        <li>Exercise</li>
        <li>Walk</li>
        <li>good sleep</li>
        <li>Hydration</li>
    </ul>
</div>
</center>
<Br>
<Br>
<Br>
<footer>End of page</footer>
    </body>
</html>

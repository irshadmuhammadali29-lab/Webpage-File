<!DOCTYPE html>
<html>
    <body>
        <h1>Simply calculatory</h1>
        <p>Hi this is simple calculator</p>
       <p id="add"></p>
       <p id="sub"></p>
       <p id="mul"></p>
       <p id="div"></p>
<script>
var num1 = 20;
var num2 = 15;
</script>
<script>
var add = num1 + num2
var sub = num1 - num2
var mul = num1 * num2
var div = num1 / num2 
</script>
<script>
document.getElementById("add").innerHTML = 
"the added value is; " + add;
document.getElementById("sub").innerHTML = 
"the subtracted value is; " + sub;
document.getElementById("mul").innerHTML = 
"the multiplied value is; " + mul;
document.getElementById("div").innerHTML =
"the divided value is; " + div;
</script>
</body>
</html>
